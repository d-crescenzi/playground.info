<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Completato - Playground</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 40px;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .icon {
            width: 64px;
            height: 64px;
            background: #e6f4ea;
            color: #137333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            font-size: 32px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #202124;
        }
        p {
            font-size: 15px;
            line-height: 1.5;
            color: #5f6368;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background-color: #000;
            color: #fff;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✓</div>
        <h1>Pagamento completato!</h1>
        <p>Grazie per l'acquisto. Il tuo pagamento è andato a buon fine. Puoi tornare all'app Playground.</p>
        <a href="https://d-crescenzi.github.io/playground.info/" class="btn">Torna alla Home</a>
    </div>
</body>
</html>
